[package]
name = "pam"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
# `cargo run -p pam` runs pam, not the test stub below.
default-run = "pam"

[features]
# The NeMo-Speech.cpp speech backend; see crates/pam-speech/build.rs.
nemo-speech = ["pam-speech/nemo-speech"]
# The Qwen3-ASR backend (`asr = "qwen:qwen3-asr-1.7b"`); see crates/pam-speech/build.rs.
qwen = ["pam-speech/qwen"]
# The local intent check (`--intent local`) through llama.cpp; see crates/pam-llama/build.rs.
llama-cpp = ["pam-core/llama-cpp"]

# A stand-in for pi, for the tests (tests/support/stub_pi.rs).
[[bin]]
name = "stub-pi"
path = "tests/support/stub_pi.rs"
test = false
doc = false

[dependencies]
pam-core.workspace = true
pam-speech.workspace = true
anyhow.workspace = true
chrono.workspace = true
libc.workspace = true
ratatui.workspace = true
serde_json.workspace = true
unicode-width.workspace = true

[dev-dependencies]
crossbeam-channel.workspace = true
hound.workspace = true
# The tiny test models' checksums.
sha2 = "0.10"
tempfile.workspace = true
